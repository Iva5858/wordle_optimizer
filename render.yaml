services:
  - type: web
    name: wordle-optimizer-api
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # PORT is automatically set by Render, but we include it as fallback
      - key: PORT
        value: 10000
    healthCheckPath: /health
    plan: free

